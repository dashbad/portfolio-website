services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashbad-portfolio:latest
    container_name: dashbad-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Heavy media lives on the host and is mounted read-only at runtime.
      # It is never part of the image (see .dockerignore).
      - ./host-media:/usr/share/caddy/media:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
