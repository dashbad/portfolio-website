services:
  portfolio:
    build:
      context: ${DOCKER_DIR}/portfolio
      dockerfile: Dockerfile
    image: dashbad-portfolio:latest
    container_name: dashbad-portfolio
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      # Mount the media folder from your host
      - ${DOCKER_DIR}/portfolio/host-media:/usr/share/caddy/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`dashbad.com`) || Host(`www.dashbad.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
